name: Build
on:
  push: { branches: [ main ] }
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC — refreshes offsets from upstream
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - name: Deps
        run: brew install ldid xz make cmake || true
      - name: Theos
        run: |
          [ -d "$HOME/theos" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          [ -n "$(ls -A "$HOME/theos/sdks" 2>/dev/null)" ] || "$HOME/theos/bin/install-sdk" || true

      - name: Sync offsets from upstream repo
        run: |
          git clone --depth 1 https://github.com/AnzeLaCM/CombatMaster-Full-Offsets.git /tmp/cm-offsets
          python3 sync_offsets.py /tmp/cm-offsets config.json
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add config.json
          git diff --cached --quiet || (git commit -m "sync offsets [skip ci]" && git push)

      - name: Generate
        run: |
          if [ -f write_tree.py ]; then
            python3 write_tree.py
          elif [ -f write-tree.py ]; then
            python3 write-tree.py
          else
            echo "no generator found"; ls -la; exit 1
          fi

      - name: Build
        run: make clean || true; make

      - name: Collect
        run: |
          mkdir -p dist
          SRC=$(find .theos/obj -name Raven.dylib | head -n1)
          [ -n "$SRC" ] || { echo "no dylib produced"; find .theos -name "*.dylib" | head; exit 1; }
          cp "$SRC" dist/Raven.dylib
          lipo -info dist/Raven.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: Raven-dylib
          path: dist/Raven.dylib
          if-no-files-found: error
