name: Regenerate Raven tree + apply aimbot patch

on:
  workflow_dispatch:
  push:
    paths:
      - "write_tree.py"
      - "Aimbot_patch.mm"
      - ".github/workflows/regen-and-patch.yml"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run write_tree.py
        run: python3 write_tree.py

      - name: Overwrite Src/Aimbot.mm with patched version
        run: |
          test -f Aimbot_patch.mm
          test -f Src/Aimbot.mm
          cp Aimbot_patch.mm Src/Aimbot.mm
          grep -q "Root cause fix" Src/Aimbot.mm
          echo "Src/Aimbot.mm patched"

      - name: Commit and push
        run: |
          git config user.name "RavenEngine Bot"
          git config user.email "bot@kremcheats.local"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "regen tree + aimbot additive-field fix"
          git push
